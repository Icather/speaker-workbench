<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
    <style>
      .box{fill:#888888;fill-opacity:.09;stroke:#8a8a8a;stroke-width:1.3;rx:8}
      .you{fill:#888888;fill-opacity:.09;stroke:#2f81f7;stroke-width:1.6;rx:8}
      .ours{fill:#888888;fill-opacity:.09;stroke:#3fb950;stroke-width:1.8;rx:8}
      .lbl{fill:#4a4a4a;font-size:13px}
      .sub{fill:#8a8a8a;font-size:11px}
      .edge{stroke:#7a7a7a;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ttl{fill:#7a7a7a;font-size:11.5px;font-weight:600;letter-spacing:.04em}
      @media (prefers-color-scheme: dark){
        .lbl{fill:#d2d2d2} .sub{fill:#9a9a9a} .ttl{fill:#a6a6a6} .mono{fill:#d2d2d2}
        .box,.you,.ours,.card,.lib,.hit{stroke-opacity:.85}
      }
    </style>
  </defs>

  <text class="ttl" x="20" y="24">MAINTAINED ELSEWHERE — USE THEM, DON'T REWRITE THEM</text>

  <rect class="you" x="20" y="38"   width="180" height="52"/>
  <text class="lbl" x="34" y="60">recordings</text>
  <text class="sub" x="34" y="77">m4a / wav / mp3 …</text>

  <rect class="you" x="222" y="38"  width="180" height="52"/>
  <text class="lbl" x="236" y="60">diarize · pyannote · FunASR</text>
  <text class="sub" x="236" y="77">VAD + segmentation + speaker ids</text>

  <rect class="you" x="424" y="38"  width="180" height="52"/>
  <text class="lbl" x="438" y="60">ASR (WhisperX / Qwen3)</text>
  <text class="sub" x="438" y="77">text + timestamps</text>

  <rect class="you" x="626" y="38"  width="150" height="52"/>
  <text class="lbl" x="640" y="60">CAM++ / ECAPA</text>
  <text class="sub" x="640" y="77">speaker embeddings</text>

  <path class="edge" d="M200,64 L222,64"/>
  <path class="edge" d="M402,64 L424,64"/>
  <path class="edge" d="M604,64 L626,64"/>

  <path class="edge" d="M470,90 L470,132"/>
  <text class="ttl" x="482" y="118">THIS REPO ↓</text>

  <rect class="ours" x="200" y="132" width="576" height="56"/>
  <text class="lbl" x="216" y="156">tools/sync.py — align segments, merge groups, build the voiceprint library</text>
  <text class="sub" x="216" y="175">two-stage clustering · measured thresholds · per-group confidence</text>

  <path class="edge" d="M488,188 L488,214"/>
  <rect class="ours" x="200" y="214" width="260" height="56"/>
  <text class="lbl" x="216" y="238">index.html — the workbench</text>
  <text class="sub" x="216" y="257">listen · label · merge · correct</text>

  <path class="edge" d="M460,242 L516,242"/>
  <rect class="ours" x="516" y="214" width="260" height="56"/>
  <text class="lbl" x="532" y="232">RTTM · SRT · VTT · CSV</text>
  <text class="sub" x="532" y="250">round-trips with the ecosystem</text>
  <text class="sub" x="532" y="264">+ voices.json for the next run</text>
</svg>
